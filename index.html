<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BURONAN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    text-align: center; /* SEMUA TULISAN RATA TENGAH */
}

header {
    background: #2563eb;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

/* 🟢 FOTO UTAMA: GANTI NAMA FILE DI SINI */

.foto-saya {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    margin: 20px auto;
    border-radius: 10px;
}

/* 🔴 AKHIR FOTO UTAMA */

.upload {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    margin: 20px 0;
}

input[type="file"] {
    display: block;
    margin: 12px auto;
    max-width: 100%;
    text-align: center;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
    text-align: center;
}

button:hover {
    background: #1d4ed8;
}

/* 🟢 GALERI FOTO */

.galeri {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    align-items: start;
}

.kartu {
    background: white;
    padding: 10px;
    border-radius: 10px;
    overflow: hidden;
    text-align: center;
}

.kartu img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    border-radius: 7px;
    cursor: pointer;
    margin: auto;
}

.kartu p {
    text-align: center;
    overflow-wrap: anywhere;
    margin: 12px 0;
}

.hapus {
    background: #dc2626;
}

#status {
    text-align: center;
    overflow-wrap: anywhere;
}

/* FOTO UKURAN BESAR */

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: #000e;
    z-index: 10;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

#viewer img {
    max-width: 100%;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

#viewer button {
    position: absolute;
    top: 15px;
    right: 15px;
}
</style>
</head>

<body>

<header>
    <h1>GALERI DEDY MULTI FUNGSI</h1>
    <p>BERIKUT FOTO</p>
</header>

<div class="container">

    <!-- 🟢 PENANDA 1: GANTI FOTO UTAMA DI SINI -->
    <!-- Ganti foto-saya.jpg dengan nama file fotomu -->

     <h2>DEDY DUKUN BERANAK</h2>

    <img
        class="foto-saya"
        src="WhatsApp Image 2026-10-17 at 15.26.52.jpeg"
        alt="FOTO PELAKU PENCURI SEMPAK"
    >
    </div>

     <h2>DEDY SEMBAKO</h2>

    <img
        class="foto-saya"
        src="WhatsApp Image 2026-10-17 at 15.21.50.jpeg"
        alt="FOTO PELAKU PENCURI SEMPAK"
    >
    </div>

    <h2>DEDY KURIR SHOPEE</h2>

    <img
        class="foto-saya"
        src="WhatsApp Image 2026-10-17 at 15.13.08.jpeg"
        alt="FOTO PELAKU PENCURI SEMPAK"
    >
    </div>

    <h2>DEDY SEDOT WC</h2>

    <img
        class="foto-saya"
        src="WhatsApp Image 2026-10-17 at 15.10.34.jpeg"
        alt="FOTO PELAKU PENCURI SEMPAK"
    >
    </div>

    <h2>DEDY CALEG</h2>

    <img
        class="foto-saya"
        src="WhatsApp Image 2026-10-17 at 15.08.52.jpeg"
        alt="FOTO PELAKU PENCURI SEMPAK"
    >
    </div>

    <h2>DEDY BURONAN</h2>

    <img
        class="foto-saya"
        src="WhatsApp Image 2026-10-17 at 14.59.31.jpeg"
        alt="FOTO PELAKU PENCURI SEMPAK"
    >
    </div>

    <h2>FOTO BURONAN</h2>

    <img
        class="foto-saya"
        src="WhatsApp Image 2026-10-17 at 14.59.30.jpeg"
        alt="FOTO PELAKU PENCURI SEMPAK"
    >
    </div>

    <h2>FOTO PELAKU</h2>

    <img
        class="foto-saya"
        src="WhatsApp Image 2026-10-17 at 14.45.11.jpeg"
        alt="FOTO PELAKU PENCURI SEMPAK"
    >
    </div>
</div>

<div id="viewer" onclick="tutupFoto()">
    <button onclick="tutupFoto()">Tutup ✕</button>
    <img id="fotoBesar" alt="Foto ukuran besar">
</div>

<script>
function tambahFoto() {
    const input = document.getElementById("pilihFoto");
    const status = document.getElementById("status");

    if (!input.files.length) {
        alert("Pilih foto terlebih dahulu!");
        return;
    }

    const file = input.files[0];

    if (!file.type.startsWith("image/")) {
        alert("File harus berupa gambar!");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
        const kartu = document.createElement("div");
        kartu.className = "kartu";

        const img = document.createElement("img");
        img.src = event.target.result;
        img.alt = file.name;
        img.onclick = function() {
            bukaFoto(img.src);
        };

        const nama = document.createElement("p");
        nama.textContent = file.name;

        kartu.appendChild(img);
        kartu.appendChild(nama);

        document.getElementById("galeri").appendChild(kartu);

        status.textContent = "Foto berhasil ditambahkan!";
        input.value = "";
    };

    reader.readAsDataURL(file);
}

function bukaFoto(src) {
    document.getElementById("fotoBesar").src = src;
    document.getElementById("viewer").style.display = "flex";
}

function tutupFoto() {
    document.getElementById("viewer").style.display = "none";
}
</script>

</body>
</html>
